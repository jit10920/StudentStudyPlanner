name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests with coverage (fails under 85%)
        run: pytest --ignore=tests/e2e --cov --cov-fail-under=85

      - name: Selenium end-to-end tests (headless Chrome)
        run: pytest tests/e2e -v
